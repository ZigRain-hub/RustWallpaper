[package]
name = "rustwallpapr"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gif = "0.13"
jpeg-decoder = { version = "0.3", default-features = false }
png = "0.17"

[target.'cfg(windows)'.dependencies]
wry = { version = "=0.57.1", default-features = false }

windows = { version = "0.62.2", features = ["Win32_Media_MediaFoundation", "Win32_Foundation", "Win32_System_Com"] }